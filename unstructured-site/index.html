<style>

.hx-plane{width:260px;height:337px;border-radius:5px;transform:rotateX(58deg) rotateZ(-40deg);box-shadow:0 1px 2px rgba(16,18,28,.10),0 10px 22px rgba(16,18,28,.12),0 30px 60px rgba(16,18,28,.16);overflow:hidden}

.hx-tick-new,.hx-tick{display:inline-flex;align-items:center;gap:8px;color:#000000}
.hx-tick-new{font-weight:700}
.hx-tick-new:hover,.hx-tick:hover{color:#000000;text-decoration:underline;text-underline-offset:3px}
.hx-new{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:2px;background:#000000;color:#ffffff;font-size:11px;font-weight:800;letter-spacing:.08em}

.hx-nav-av{display:flex;align-items:center;padding:0 22px;border-radius:4px;background:linear-gradient(90deg,#ffa5ec 0%,#ffc7c0 35%,#fde49a 70%,#fef95d 100%);color:#000000;font-size:16px;font-weight:700;white-space:nowrap;transition:filter .18s ease}
.hx-nav-av:hover{color:#000000;filter:brightness(1.06)}

<!-- ExtractionCards-v5 -->
<style>
body{margin:0}
a{color:#000000;text-decoration:none}a:hover{color:#2c2c2c}

.ex-fade{transition:opacity .4s}
.ex-mono{font-family:'IBM Plex Mono',monospace}
.ex-caret{display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-2px;background:#000000;animation:ex-blink 1s steps(1) infinite}

.ex-btn{display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 24px;border:1.5px solid #000000;border-radius:4px;font-size:16px;font-weight:500;color:#000000}
.ex-mode{display:flex;flex-direction:column;align-items:flex-start;gap:12px;width:100%;box-sizing:border-box;padding:24px 26px;border:1.5px solid transparent;border-radius:4px;background:transparent;text-align:left;font-family:Inter,system-ui,sans-serif;color:#000000;cursor:pointer;transition:background .25s,border-color .25s}

.ex-mode.ex-on{background:#ffffff;border-color:#000000}

.ex-mode.ex-on .ex-mh{color:#000000}
.ex-prog{display:block;width:100%;height:3px;margin-top:6px;background:#efefef;overflow:hidden}
.ex-grid-y{background-color:#fef95d}
.ex-grid-p{background-color:#ffa5ec}
.ex-pill{display:inline-flex;align-items:center;height:28px;padding:0 10px;border:1px solid #000000;border-radius:2px;background:#ffffff;font-size:13px;font-weight:500}
</style>

<style>

const STEPS = [{"num": "1", "title": "Documents In", "img": "assets/ffd0558d205789ca7f46d582d8bf4daa.jpg", "desc": "Each page enters as an image, preserving the layout and visual details.", "color": "#fef95d", "alt": "A scanned supplier spec sheet"}, {"num": "2", "title": "Extract & Identify", "img": "assets/398d7d364cb4aef4c105d414628a0658.jpg", "desc": "Finds the regions on each page and the order they should be read.", "color": "#fec017", "alt": "The page with every region outlined and numbered in reading order"}, {"num": "3", "title": "Read & Label", "img": "assets/14d91a541deb51a19e3a7b7d3dbfd1cf.jpg", "desc": "Reads each region up close, identifying what it is and extracting its contents.", "color": "#ffa5ec", "alt": "Each region tagged as a title, table, image, list item or form"}, {"num": "4", "title": "Connect the Content", "img": "assets/98d1625e586ac4a0f34b81f6641546ae.jpg", "desc": "Looks across the document to organize headings and connect captions with their figures.", "color": "#26c6ff", "alt": "The document hierarchy, with tables and notes nested under their headings"}, {"num": "5", "title": "Structured Data Out", "img": "assets/d7b9f620d1aeadd863f4f9418ac53877.png", "desc": "Delivers the content and its structure as element JSON, ready for downstream use.", "color": "#5afda5", "alt": "The structured element JSON output"}];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { ex: false, step: -1, hold: false }; }
  componentDidMount() {
    // closed -> open -> walk steps 1..5 -> close -> repeat
    this.seq = 0;
    const tick = () => {
      if (!this.state.hold) {
        const n = STEPS.length;
        this.seq = (this.seq + 1) % (n + 2);
        if (this.seq === 0) this.setState({ ex: false, step: -1 });
        else if (this.seq === 1) this.setState({ ex: true, step: -1 });
        else this.setState({ ex: true, step: this.seq - 2 });
      }
      this.timer = setTimeout(tick, this.seq === 0 ? 1800 : this.seq === 1 ? 1300 : 2100);
    };
    this.timer = setTimeout(tick, 800);
  }
  componentWillUnmount() { clearTimeout(this.timer); }
  renderVals() {
    const s = this.state;
    const ex = s.ex || s.hold;
    const n = STEPS.length;
    const act = s.step;
    const cur = act >= 0 ? STEPS[act] : null;
    return {
      layers: STEPS.map((L, i) => ({
        num: L.num, title: L.title, img: L.img, alt: L.alt,
        // closed: every layer sits exactly on the scan, so it reads as one page
        dx: ex ? Math.round((i - (n - 1) / 2) * 236) : 0,
        dy: ex ? (i === act ? -26 : 0) : 0,
        z: ex ? i + 1 : n - i,
        op: ex || i === 0 ? 1 : 0,
        delay: ex ? (i * 80) + 'ms, ' + (i * 80) + 'ms' : ((n - 1 - i) * 50) + 'ms, ' + ((n - 1 - i) * 50 + 750) + 'ms',
        lblOp: ex ? 1 : 0,
        lblBg: i === act ? L.color : '#ffffff',
        hover: () => this.setState({ hold: true, ex: true, step: i })
      })),
      descOp: cur ? 1 : 0,
      descTitle: cur ? cur.title : '',
      desc: cur ? cur.desc : '',
      holdOff: () => this.setState({ hold: false })
    };

}
